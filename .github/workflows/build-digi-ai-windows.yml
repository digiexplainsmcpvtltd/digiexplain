name: Build Digi AI Windows application

on:
  push:
    branches:
      - feature/digi-ai-personal-operator
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: digi-ai/desktop-agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build local service executable
        working-directory: digi-ai/desktop-agent
        run: pyinstaller --noconfirm --clean --onefile --collect-all keyring --collect-all uvicorn --collect-all fastapi --collect-all cryptography --collect-all pypdf --collect-all docx --collect-all openpyxl --collect-all pptx --name DigiAI-Service --console agent.py
      - name: Build desktop application
        working-directory: digi-ai/desktop-agent
        run: pyinstaller --noconfirm --clean --onefile --collect-all keyring --collect-all uvicorn --collect-all fastapi --collect-all cryptography --windowed --name DigiAI desktop_app.py
      - name: Assemble portable application folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release/DigiAI | Out-Null
          Copy-Item digi-ai/desktop-agent/dist/DigiAI.exe release/DigiAI/
          Copy-Item digi-ai/desktop-agent/dist/DigiAI-Service.exe release/DigiAI/
          @'
          Digi AI - Windows Desktop MVP

          Keep DigiAI.exe and DigiAI-Service.exe in the same folder.
          Double-click DigiAI.exe to start.
          Encrypted local memory is stored in %LOCALAPPDATA%\DigiAI.

          Includes local encrypted Memory Vault and owner-selected laptop document indexing.
          Folder scans are limited to 500 supported files per scan and 8 MB per file.
          WhatsApp, email, Urdu voice, live AI chat and full computer control are not yet connected.
          '@ | Set-Content release/DigiAI/READ-ME-FIRST.txt
      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: DigiAI-Windows-Portable
          path: release/DigiAI/
          if-no-files-found: error
